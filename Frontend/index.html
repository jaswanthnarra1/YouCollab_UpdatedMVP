<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Set the theme class before first paint so there's no dark→light (or
      // light→dark) flash while React/next-themes mount — a hardcoded
      // class="dark" on <html> here previously caused every fresh page load
      // (not just SPA navigation) to briefly show dark before correcting to
      // whatever the user last chose. Key/logic mirrors next-themes' own
      // defaults (localStorage key "theme"; ThemeProvider is configured with
      // defaultTheme="dark", enableSystem={false} in src/routes/App.tsx).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>YouCollab — Pune's creator-brand collab marketplace</title>
    <meta name="description" content="Where Pune's brands and creators actually find each other. Verified Instagram, real briefs, real budgets." />
